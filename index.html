<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="班表王"/>
<title>班表王</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:#F5F2EE;color:#1C1A18;min-height:100vh;-webkit-font-smoothing:antialiased}
.app{max-width:430px;margin:0 auto;padding-bottom:100px}

.nav{position:sticky;top:0;z-index:200;background:#F5F2EE;border-bottom:1px solid #D9D4CC;display:flex;align-items:center;justify-content:space-between;padding:0 18px;height:52px}
.nav-brand{font-size:17px;font-weight:700;letter-spacing:.06em}
.nav-brand small{font-family:'DM Mono',monospace;font-size:9px;color:#8C8680;letter-spacing:.18em;display:block;margin-top:-2px}
.ham-btn{width:36px;height:36px;border-radius:50%;background:transparent;border:1px solid #D9D4CC;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ham-line{width:14px;height:1px;background:#1C1A18;display:block}

.drawer-overlay{position:fixed;inset:0;background:rgba(28,26,24,.45);z-index:300;backdrop-filter:blur(2px);display:none}
.drawer-overlay.show{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:82%;max-width:320px;background:#FDFCFA;z-index:400;display:flex;flex-direction:column;box-shadow:-8px 0 40px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
.drawer.show{transform:translateX(0)}
.drawer-head{padding:20px 20px 16px;border-bottom:1px solid #D9D4CC;display:flex;align-items:center;justify-content:space-between}
.drawer-title{font-size:14px;font-weight:600}
.close-btn{width:28px;height:28px;border-radius:50%;background:#EDEAE5;border:none;cursor:pointer;font-size:14px;color:#8C8680}
.drawer-body{flex:1;overflow-y:auto;padding:20px}
.dlabel{font-size:9px;letter-spacing:.16em;color:#B5B0AA;text-transform:uppercase;margin-bottom:10px;display:block;font-weight:500}
.ddivider{height:1px;background:#D9D4CC;margin:20px 0}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #D9D4CC;font-size:13px;gap:12px}
.set-row:last-child{border-bottom:none}
.finput{background:#EDEAE5;border:1px solid #D9D4CC;border-radius:7px;padding:7px 10px;font-family:inherit;font-size:13px;color:#1C1A18;outline:none;width:100%;margin-top:4px}
.finput:focus{border-color:#1C1A18}
.finput-sm{background:#EDEAE5;border:1px solid #D9D4CC;border-radius:7px;padding:6px 8px;font-family:'DM Mono',monospace;font-size:12px;color:#1C1A18;outline:none;width:88px;text-align:right;flex-shrink:0}
.finput-sm:focus{border-color:#1C1A18}
.sync-btn{width:100%;padding:12px;border-radius:10px;background:#1C1A18;color:#F5F2EE;border:none;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;margin-top:12px}
.sync-btn:disabled{opacity:.5}
.sync-note{margin-top:8px;font-size:11px;color:#8C8680;line-height:1.6;display:none}
.sync-note.show{display:block}

.tabs{display:flex;border-bottom:1px solid #D9D4CC;background:#F5F2EE;position:sticky;top:52px;z-index:100}
.tab-btn{flex:1;height:44px;background:transparent;border:none;border-bottom:2px solid transparent;color:#8C8680;font-size:11px;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tab-btn .ico{font-size:14px}
.tab-btn.active{color:#1C1A18;border-bottom-color:#1C1A18;font-weight:500}
.tab-panel{display:none;flex-direction:column;gap:14px;padding:16px}
.tab-panel.active{display:flex}

.sync-bar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:#EDEAE5;font-size:11px;color:#8C8680;border-bottom:1px solid #D9D4CC}
.sdot{width:6px;height:6px;border-radius:50%;background:#B5B0AA;flex-shrink:0}
.sdot.ok{background:#7A9188}.sdot.err{background:#B05040}
.sdot.loading{background:#9A7D5A;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.card{background:#FDFCFA;border:1px solid #D9D4CC;border-radius:12px;overflow:hidden}
.card-head{padding:14px 16px 0;font-size:9px;letter-spacing:.16em;color:#B5B0AA;text-transform:uppercase;font-weight:500}

/* ── 月曆 ── */
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px}
.cal-month{font-size:18px;font-weight:700}
.cal-year{font-size:11px;color:#8C8680}
.cal-arrow{width:28px;height:28px;border-radius:50%;background:transparent;border:1px solid #D9D4CC;cursor:pointer;font-size:13px;color:#8C8680}
.mode-row{display:flex;gap:6px;padding:0 16px 10px}
.mpill{padding:5px 14px;border-radius:20px;border:1px solid #D9D4CC;background:transparent;color:#8C8680;font-size:11px;font-family:inherit;cursor:pointer}
.mpill.active{background:#1C1A18;border-color:#1C1A18;color:#F5F2EE;font-weight:500}
.filter-row{display:flex;gap:6px;padding:0 16px 10px;flex-wrap:wrap}
.fchip{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;border:1px solid #D9D4CC;background:transparent;font-size:11px;font-family:inherit;color:#8C8680;cursor:pointer}
.fchip.on{border-color:currentColor}
.fdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* 格子：去掉左右 padding，讓 7 欄盡量寬 */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:0 2px 8px;gap:1px}
.wday{text-align:center;font-size:9px;color:#B5B0AA;padding:4px 0 5px}
.wday.u{color:#B05040}.wday.s{color:#4A5568}

.ccell{border-radius:3px;overflow:hidden;cursor:pointer;padding-bottom:3px;transition:background .1s}
.ccell:hover{background:#EDEAE5}
.ccell.other{opacity:.2;pointer-events:none}
.ccell.sel{outline:1.5px solid #1C1A18;outline-offset:1px}
.ccell.dbl-cell{background:rgba(176,80,64,.07)}
.ccell.dbl-cell:hover{background:rgba(176,80,64,.13)}

.cnum{font-size:10px;text-align:center;padding:2px 0;font-family:'DM Mono',monospace;color:#8C8680;line-height:1.2}
.cnum.today-n{color:#1C1A18;font-weight:700}
.cnum.sun-n{color:#B05040}.cnum.sat-n{color:#4A5568}
.cnum.dbl-n{color:#B05040;font-weight:700}
.today-line{width:12px;height:1.5px;background:#1C1A18;margin:0 auto 1px;border-radius:1px}
.dbl-tag{font-size:6px;color:#B05040;text-align:center;font-weight:700;line-height:1.3}

/* ── bar 樣式：兩行設計 ──
   .cbar     = 單行（我的班，只顯示時間）
   .cbar2    = 兩行（代班，第一行時間，第二行名字）
*/
.cbar{
  display:block;
  margin:1px 1px;
  border-radius:2px;
  padding:1px 2px;
  font-size:8.5px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  line-height:1.5;
}
.cbar2{
  display:block;
  margin:1px 1px;
  border-radius:2px;
  padding:1px 2px;
  font-size:8.5px;
  font-weight:600;
  line-height:1.4;
}
.cbar2 .b2-time{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cbar2 .b2-name{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.cb-pink{background:#F0E6E2;color:#C9A99A}
.cb-sage{background:#DDE8E4;color:#7A9188}
.cb-ink{background:#E2E6EE;color:#4A5568}
.cb-gold{background:#EEE6DA;color:#9A7D5A}
.cb-red{background:#F5E0DC;color:#B05040}

.legend{display:flex;gap:10px;padding:8px 16px;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:4px;font-size:10px;color:#8C8680}
.leg-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

.detail-head{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #D9D4CC}
.detail-date{font-size:15px;font-weight:700}
.detail-meta{font-size:11px;color:#8C8680;margin-top:2px}
.shift-row{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-bottom:1px solid #D9D4CC}
.shift-row:last-child{border-bottom:none}
.sbar{width:3px;border-radius:2px;min-height:36px;flex-shrink:0;align-self:stretch}
.stime{font-family:'DM Mono',monospace;font-size:16px;font-weight:500}
.stype{font-size:11px;color:#8C8680;margin-top:3px}
.sbadge{margin-left:auto;font-size:10px;padding:3px 8px;border-radius:20px;flex-shrink:0;font-family:'DM Mono',monospace}

.stats-grid{display:grid;grid-template-columns:repeat(2,1fr)}
.stat-cell{padding:14px 16px;border-right:1px solid #D9D4CC;border-bottom:1px solid #D9D4CC}
.stat-cell:nth-child(2n){border-right:none}
.stat-cell:nth-last-child(-n+2){border-bottom:none}
.stat-num{font-family:'DM Mono',monospace;font-size:22px;font-weight:500}
.stat-lbl{font-size:10px;color:#8C8680;margin-top:3px}

.sal-hero{padding:20px 16px 16px;border-bottom:1px solid #D9D4CC}
.sal-cycle{font-size:10px;color:#8C8680;margin-bottom:6px;font-family:'DM Mono',monospace}
.sal-amt{font-family:'DM Mono',monospace;font-size:36px;font-weight:500;color:#9A7D5A;letter-spacing:-.02em}
.sal-sub{font-size:11px;color:#8C8680;margin-top:4px}
.sal-row{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;border-bottom:1px solid #D9D4CC;font-size:12px}
.sal-row:last-child{border-bottom:none}
.sal-row .lbl{color:#8C8680}
.sal-row .val{font-family:'DM Mono',monospace;font-size:12px}
.sal-total .lbl,.sal-total .val{color:#1C1A18;font-weight:700}

.form-sec{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.flabel{font-size:10px;letter-spacing:.1em;color:#8C8680;text-transform:uppercase;margin-bottom:4px;display:block}
.fi{background:#F5F2EE;border:1px solid #D9D4CC;border-radius:8px;padding:9px 12px;color:#1C1A18;font-family:inherit;font-size:13px;outline:none;width:100%}
.fi:focus{border-color:#1C1A18}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.type-sel{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type-opt{padding:10px;border-radius:8px;border:1px solid #D9D4CC;background:transparent;cursor:pointer;text-align:center;font-family:inherit;width:100%}
.type-opt.sel{border-color:#1C1A18;background:#EDEAE5}
.to-ico{font-size:16px;display:block;margin-bottom:4px}
.to-lbl{font-size:11px;color:#8C8680;display:block;line-height:1.5}
.type-opt.sel .to-lbl{color:#1C1A18}
.type-support{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;border:1px solid #D9D4CC;background:transparent;cursor:pointer;text-align:left;font-family:inherit;width:100%;margin-top:8px}
.type-support.sel{border-color:#B05040;background:rgba(176,80,64,.06)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:8px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;border:none}
.btn-dark{background:#1C1A18;color:#F5F2EE}
.btn-ghost{background:#EDEAE5;color:#8C8680}
.btn-danger{background:rgba(176,80,64,.08);color:#B05040;border:1px solid rgba(176,80,64,.2)}
.btn-red{background:#B05040;color:#F5F2EE}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:6px}
.btn-full{width:100%}

.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px}
.b-pink{background:#F0E6E2;color:#C9A99A}
.b-sage{background:#DDE8E4;color:#7A9188}
.b-ink{background:#E2E6EE;color:#4A5568}
.b-gold{background:#EEE6DA;color:#9A7D5A}
.b-dark{background:#1C1A18;color:#F5F2EE}
.b-red{background:rgba(176,80,64,.12);color:#B05040}

.li-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #D9D4CC}
.li-row:last-child{border-bottom:none}
.li-ava{width:32px;height:32px;border-radius:50%;background:#EDEAE5;border:1px solid #D9D4CC;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#8C8680;flex-shrink:0}
.li-name{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.li-sub{font-size:11px;color:#8C8680;margin-top:2px}

.acc-hd{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;border-top:1px solid #D9D4CC}
.acc-bd{display:none}
.acc-bd.open{display:block}

.empty{text-align:center;padding:40px 20px;color:#8C8680}
.eico{font-size:32px;margin-bottom:10px;opacity:.5}
.empty p{font-size:13px;line-height:1.8}

.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:#1C1A18;color:#F5F2EE;border-radius:20px;padding:9px 18px;font-size:12px;z-index:999;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.2);opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">

<div class="nav">
  <div class="nav-brand">班表王<small>SHIFT MANAGER</small></div>
  <button class="ham-btn" onclick="openDrawer()">
    <span class="ham-line"></span><span class="ham-line"></span><span class="ham-line"></span>
  </button>
</div>

<div class="drawer-overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <span class="drawer-title">設定</span>
    <button class="close-btn" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body">
    <span class="dlabel">我的資料</span>
    <div style="margin-bottom:12px">
      <div class="flabel">你的名字（與班表一致）</div>
      <input class="finput" id="myName" placeholder="例：茜" oninput="saveSetting()"/>
    </div>
    <div>
      <div class="flabel">Google Sheet API 網址</div>
      <input class="finput" id="apiUrl" placeholder="貼上 Apps Script 網址" style="font-size:11px" oninput="saveSetting()"/>
    </div>
    <button class="sync-btn" id="syncBtn" onclick="doSync()">↻ 同步班表</button>
    <div class="sync-note" id="syncNote"></div>
    <div class="ddivider"></div>
    <span class="dlabel">薪資設定</span>
    <div class="set-row"><span>薪資類型</span><select class="finput-sm" id="salType" onchange="saveSetting();updateSalUI()"><option value="monthly">月薪</option><option value="hourly">時薪</option></select></div>
    <div class="set-row" id="rowBase"><span>底薪</span><input class="finput-sm" type="number" id="salBase" value="27000" oninput="saveSetting()"/></div>
    <div class="set-row" id="rowHourly" style="display:none"><span>時薪</span><input class="finput-sm" type="number" id="salHourly" value="180" oninput="saveSetting()"/></div>
    <div class="set-row" id="rowAttend"><span>全勤獎金</span><input class="finput-sm" type="number" id="salAttend" value="2000" oninput="saveSetting()"/></div>
    <div class="set-row" id="rowOtThresh"><span>超時門檻（小時）</span><input class="finput-sm" type="number" id="salOtThresh" value="200" oninput="saveSetting()"/></div>
    <div class="set-row" id="rowOtRate"><span>超時時薪</span><input class="finput-sm" type="number" id="salOtRate" value="140" oninput="saveSetting()"/></div>
    <div class="set-row"><span>晚班津貼（每月固定）</span><input class="finput-sm" type="number" id="salEve" value="1000" oninput="saveSetting()"/></div>
    <div class="set-row"><span>大夜班津貼（每月固定）</span><input class="finput-sm" type="number" id="salNight" value="2000" oninput="saveSetting()"/></div>
    <div class="set-row"><span>支援時薪</span><input class="finput-sm" type="number" id="salSupport" value="140" oninput="saveSetting()"/></div>
  </div>
</div>

<div class="sync-bar">
  <span class="sdot" id="sdot"></span>
  <span id="sbarTxt">尚未同步班表</span>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab(0,this)"><span class="ico">📅</span><span>班表</span></button>
  <button class="tab-btn" onclick="switchTab(1,this)"><span class="ico">¥</span><span>薪資</span></button>
  <button class="tab-btn" onclick="switchTab(2,this)"><span class="ico">⇄</span><span>代班</span></button>
  <button class="tab-btn" onclick="switchTab(3,this)"><span class="ico">◎</span><span>找人</span></button>
</div>

<!-- TAB 0 -->
<div class="tab-panel active" id="tab0">
  <div class="card">
    <div class="cal-nav">
      <button class="cal-arrow" onclick="prevM()">‹</button>
      <div style="text-align:center"><div class="cal-month" id="calMonth"></div><div class="cal-year" id="calYear"></div></div>
      <button class="cal-arrow" onclick="nextM()">›</button>
    </div>
    <div class="mode-row">
      <button class="mpill active" id="mFull" onclick="setMode('full')">完整</button>
      <button class="mpill" id="mReal" onclick="setMode('real')">實際出勤</button>
    </div>
    <div class="filter-row" id="filterRow">
      <button class="fchip on" id="fMy" onclick="togF('my')" style="color:#C9A99A;border-color:#C9A99A"><span class="fdot" style="background:#C9A99A"></span>我的班</button>
      <button class="fchip on" id="fGive" onclick="togF('give')" style="color:#9A7D5A;border-color:#9A7D5A"><span class="fdot" style="background:#9A7D5A"></span>我去代</button>
      <button class="fchip on" id="fTake" onclick="togF('take')" style="color:#4A5568;border-color:#4A5568"><span class="fdot" style="background:#4A5568"></span>被代</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="legend">
      <div class="leg-item"><span class="leg-dot" style="background:#C9A99A"></span>早班</div>
      <div class="leg-item"><span class="leg-dot" style="background:#7A9188"></span>晚班</div>
      <div class="leg-item"><span class="leg-dot" style="background:#4A5568"></span>大夜</div>
      <div class="leg-item"><span class="leg-dot" style="background:#9A7D5A"></span>我去代</div>
      <div class="leg-item"><span class="leg-dot" style="background:#B05040"></span>×2</div>
    </div>
  </div>
  <div id="detailPanel"></div>
  <div class="empty" id="emptyMsg"><div class="eico">📅</div><p>右上角選單<br/>輸入名字並同步班表</p></div>
</div>

<!-- TAB 1 -->
<div class="tab-panel" id="tab1">
  <div class="empty" id="salEmpty"><div class="eico">¥</div><p>請先同步班表</p></div>
  <div id="salContent" style="display:none;flex-direction:column;gap:14px">
    <div class="card" id="salCard"></div>
    <div class="card" id="subHoursCard"></div>
    <div class="card" id="statsCard"></div>
    <div class="card">
      <div class="card-head">雙倍工資日期</div>
      <div class="form-sec">
        <div class="fgrid2">
          <div><span class="flabel">日期</span><input class="fi" type="date" id="doubleDate"/></div>
          <div><span class="flabel">備註</span><input class="fi" id="doubleNote" placeholder="例：春節"/></div>
        </div>
        <button class="btn btn-red btn-full" onclick="addDouble()">標記為雙倍工資</button>
      </div>
      <div id="doubleList"></div>
    </div>
  </div>
</div>

<!-- TAB 2 -->
<div class="tab-panel" id="tab2">
  <div class="card">
    <div class="card-head">新增代班記錄</div>
    <div class="form-sec">
      <div>
        <span class="flabel">這次代班是</span>
        <div class="type-sel">
          <button class="type-opt sel" id="tGive" onclick="setSubT('give')">
            <span class="to-ico">🔄</span>
            <span class="to-lbl">我去幫別人<br/><span style="color:#9A7D5A;font-size:10px;font-family:'DM Mono'">對方欠我工時</span></span>
          </button>
          <button class="type-opt" id="tCov" onclick="setSubT('covered')">
            <span class="to-ico">🙏</span>
            <span class="to-lbl">別人幫我代<br/><span style="color:#4A5568;font-size:10px;font-family:'DM Mono'">我欠對方工時</span></span>
          </button>
        </div>
        <button class="type-support" id="tSupport" onclick="setSubT('support')">
          <span style="font-size:16px">🏢</span>
